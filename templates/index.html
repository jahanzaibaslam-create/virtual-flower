<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>A Rose For You 🌹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #442342,
            #140c20 55%,
            #04030a 100%
        );

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

#scene {
    position: fixed;
    inset: 0;
}

.title {

    position: fixed;

    top: 5%;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 20;

    pointer-events: none;

    color: white;

    text-shadow:
        0 0 15px rgba(255,120,180,.8),
        0 0 35px rgba(255,40,130,.5);
}

.title h1 {

    margin: 0;

    font-size: 40px;
}

.title p {

    margin-top: 8px;

    color: #f4d7e4;

    font-size: 15px;
}

.bottom {

    position: fixed;

    bottom: 4%;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 20;

    pointer-events: none;

    color: #ffeaf2;
}

.poetry {

    direction: rtl;

    font-size: 18px;

    line-height: 1.75;

    padding: 0 15px;

    text-shadow:
        0 0 10px rgba(255,150,200,.4);
}

.hint {

    margin-top: 7px;

    font-size: 12px;

    opacity: .65;
}

@media(max-width:600px) {

    .title h1 {
        font-size: 27px;
    }

    .title p {
        font-size: 12px;
    }

    .poetry {
        font-size: 14px;
    }

}

</style>

</head>

<body>


<div id="scene"></div>


<div class="title">

    <h1>🌹 A Rose For You 🌹</h1>

    <p>
        Watch it bloom... ❤️
    </p>

</div>


<div class="bottom">

    <div class="poetry">

        تیری مسکراہٹ سے مہک اٹھتا ہے دل،
        جیسے گلِ گلاب سے مہک اٹھے چمن۔ 🌹

        <br>

        تو پھولوں جیسی نہیں،
        پھول تو تیرے حسن کی بس ایک مثال ہیں۔ ✨

        <br>

        اور اگر محبت ایک خوبصورت دعا ہے،
        تو میری ہر دعا میں تیرا نام ہو۔ ❤️

    </div>

    <div class="hint">
        Drag with your mouse or finger to rotate the rose 🌹
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   SCENE
===================================================== */

const scene =
    new THREE.Scene();


/* =====================================================
   CAMERA
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    2.2,
    8
);


/* =====================================================
   RENDERER
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("scene")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   LIGHTS
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);


const pinkLight =
    new THREE.PointLight(
        0xff3975,
        18,
        15
    );

pinkLight.position.set(
    4,
    5,
    4
);

scene.add(pinkLight);


const whiteLight =
    new THREE.PointLight(
        0xffdce9,
        10,
        12
    );

whiteLight.position.set(
    -4,
    4,
    5
);

scene.add(whiteLight);


/* =====================================================
   MAIN ROSE GROUP
===================================================== */

const rose =
    new THREE.Group();

scene.add(rose);

rose.position.y =
    -0.4;


/* =====================================================
   STEM
===================================================== */

const stemGeometry =
    new THREE.CylinderGeometry(
        .08,
        .12,
        4.5,
        24
    );

const stemMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x176b35,
        roughness: .7
    });

const stem =
    new THREE.Mesh(
        stemGeometry,
        stemMaterial
    );

stem.position.y =
    -1.0;

rose.add(stem);


/* =====================================================
   LEAVES
===================================================== */

function createLeaf(
    x,
    y,
    z,
    rotation
) {

    const geometry =
        new THREE.SphereGeometry(
            1,
            24,
            16
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x239447,
            roughness: .65
        });

    const leaf =
        new THREE.Mesh(
            geometry,
            material
        );

    leaf.scale.set(
        1.4,
        .18,
        .55
    );

    leaf.position.set(
        x,
        y,
        z
    );

    leaf.rotation.z =
        rotation;

    rose.add(leaf);
}


createLeaf(
    -.5,
    -1.3,
    0,
    -.55
);

createLeaf(
    .5,
    -1.8,
    0,
    .55
);


/* =====================================================
   PETAL CREATOR
===================================================== */

const petals = [];


function createPetal(
    radius,
    height,
    angle,
    size,
    color,
    delay,
    layer
) {

    const geometry =
        new THREE.SphereGeometry(
            1,
            24,
            16
        );

    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            roughness: .38,

            metalness: .02,

            side: THREE.DoubleSide
        });

    const petal =
        new THREE.Mesh(
            geometry,
            material
        );


    /*
       Make the sphere look like
       a large curved petal.
    */

    petal.scale.set(
        size,
        .18,
        size * .72
    );


    /*
       Start petals inside the flower.
    */

    petal.position.set(
        0,
        1.25,
        0
    );


    petal.rotation.y =
        angle;


    petal.rotation.x =
        .25;


    rose.add(petal);


    petals.push({

        mesh: petal,

        radius: radius,

        height: height,

        angle: angle,

        size: size,

        delay: delay,

        layer: layer,

        opened: false

    });

}


/* =====================================================
   OUTER PETALS
===================================================== */

const outerCount = 16;


for (
    let i = 0;
    i < outerCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        outerCount;


    createPetal(
        1.12,
        1.35,
        angle,
        .95,
        0xc91445,
        i * .08,
        0
    );

}


/* =====================================================
   SECOND LAYER
===================================================== */

const secondCount = 14;


for (
    let i = 0;
    i < secondCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        secondCount
        + .18;


    createPetal(
        .82,
        1.58,
        angle,
        .78,
        0xed255b,
        1.5 + i * .08,
        1
    );

}


/* =====================================================
   INNER PETALS
===================================================== */

const innerCount = 11;


for (
    let i = 0;
    i < innerCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        innerCount;


    createPetal(
        .52,
        1.80,
        angle,
        .62,
        0xff4776,
        2.8 + i * .1,
        2
    );

}


/* =====================================================
   CENTER
===================================================== */

const centerGeometry =
    new THREE.SphereGeometry(
        .28,
        24,
        24
    );

const centerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x7a0625,
        roughness: .35
    });

const center =
    new THREE.Mesh(
        centerGeometry,
        centerMaterial
    );

center.position.y =
    1.95;

rose.add(center);


/* =====================================================
   SMALL CENTER SPIRAL
===================================================== */

for (
    let i = 0;
    i < 9;
    i++
) {

    const angle =
        i * .65;

    const radius =
        .25 -
        i * .018;

    const dot =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .055,
                12,
                12
            ),

            new THREE.MeshStandardMaterial({
                color: 0xff6c91
            })

        );


    dot.position.set(

        Math.cos(angle) *
        radius,

        2.02 +
        i * .025,

        Math.sin(angle) *
        radius

    );


    rose.add(dot);

}


/* =====================================================
   GLOW
===================================================== */

const glow =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            1.8,
            32,
            32
        ),

        new THREE.MeshBasicMaterial({

            color: 0xff1760,

            transparent: true,

            opacity: .055,

            depthWrite: false

        })

    );

glow.position.y =
    1.4;

rose.add(glow);


/* =====================================================
   STARS
===================================================== */

const starPositions = [];

for (
    let i = 0;
    i < 400;
    i++
) {

    starPositions.push(

        (Math.random() - .5) *
        24,

        Math.random() *
        14 - 3,

        (Math.random() - .5) *
        24

    );

}


const starGeometry =
    new THREE.BufferGeometry();

starGeometry.setAttribute(

    "position",

    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )

);


const starMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: .035,

        transparent: true,

        opacity: .8

    });


const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =====================================================
   FLOATING HEARTS
===================================================== */

for (
    let i = 0;
    i < 18;
    i++
) {

    const heart =
        document.createElement(
            "div"
        );

    heart.innerHTML =
        ["❤️","💕","💗","✨"]
        [
            Math.floor(
                Math.random() * 4
            )
        ];

    heart.style.position =
        "fixed";

    heart.style.left =
        Math.random() * 100 +
        "%";

    heart.style.bottom =
        "-30px";

    heart.style.fontSize =
        12 +
        Math.random() * 18 +
        "px";

    heart.style.pointerEvents =
        "none";

    heart.style.zIndex =
        "5";

    document.body.appendChild(
        heart
    );


    heart.animate(

        [

            {
                transform:
                    "translateY(0) scale(.6)",

                opacity: 0

            },

            {

                transform:
                    "translateY(-50vh) scale(1)",

                opacity: .8

            },

            {

                transform:
                    "translateY(-110vh) scale(1.2)",

                opacity: 0

            }

        ],

        {

            duration:
                6500 +
                Math.random() * 6000,

            delay:
                Math.random() * 5000,

            iterations:
                Infinity

        }

    );

}


/* =====================================================
   MOUSE / TOUCH ROTATION
===================================================== */

let dragging = false;

let previousX = 0;

let targetRotation = 0;

let currentRotation = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(event) {

        dragging = true;

        previousX =
            event.clientX;

    }
);


window.addEventListener(
    "pointerup",
    function() {

        dragging = false;

    }
);


window.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging)
            return;


        const difference =
            event.clientX -
            previousX;


        targetRotation +=
            difference * .008;


        previousX =
            event.clientX;

    }
);


/* =====================================================
   ANIMATION
===================================================== */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    /* --------------------------------
       PETAL BLOOM
    -------------------------------- */

    petals.forEach(
        function(p, index) {

            const elapsed =
                time -
                p.delay;


            if (elapsed > 0) {

                const progress =
                    Math.min(
                        elapsed / 2.0,
                        1
                    );


                /*
                   Smooth easing.
                */

                const ease =
                    1 -
                    Math.pow(
                        1 - progress,
                        3
                    );


                const breathing =
                    1 +
                    Math.sin(
                        time * 1.4 +
                        index
                    ) * .035;


                p.mesh.position.x =
                    Math.cos(
                        p.angle
                    ) *
                    p.radius *
                    ease;


                p.mesh.position.z =
                    Math.sin(
                        p.angle
                    ) *
                    p.radius *
                    ease;


                p.mesh.position.y =
                    p.height +
                    Math.sin(
                        time * 1.3 +
                        index
                    ) * .025;


                p.mesh.scale.x =
                    p.size *
                    breathing *
                    ease;


                p.mesh.scale.z =
                    p.size *
                    .72 *
                    breathing *
                    ease;


                /*
                   Petals gradually tilt outward.
                */

                p.mesh.rotation.x =
                    .2 +
                    ease *
                    .45;


                p.mesh.rotation.y =
                    p.angle;

            }

        }
    );


    /* --------------------------------
       ROSE ROTATION
    -------------------------------- */

    currentRotation +=
        (targetRotation -
        currentRotation) *
        .06;


    rose.rotation.y =
        currentRotation;


    /*
       Very slow automatic movement.
    */

    if (!dragging) {

        targetRotation +=
            .0015;

    }


    /* --------------------------------
       FLOATING
    -------------------------------- */

    rose.position.y =
        -.4 +
        Math.sin(
            time * .8
        ) * .045;


    /* --------------------------------
       GLOW
    -------------------------------- */

    glow.scale.setScalar(

        1 +
        Math.sin(
            time * 2
        ) * .06

    );


    /* --------------------------------
       LIGHT MOVEMENT
    -------------------------------- */

    pinkLight.position.x =
        Math.sin(time) * 4;

    pinkLight.position.z =
        Math.cos(time) * 4;


    /* --------------------------------
       STARS
    -------------------------------- */

    stars.rotation.y +=
        .00015;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>

</html>
