<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>A Rose For You 🌹</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:
        radial-gradient(
            circle at center,
            #3b2947,
            #120d20 55%,
            #05040b 100%
        );

    color: white;
}


/* =========================
   CANVAS
========================= */

#canvasContainer {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;
}


/* =========================
   TOP MESSAGE
========================= */

.title {

    position: fixed;

    top: 6%;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 10;

    pointer-events: none;

    text-shadow:
        0 0 15px rgba(255,150,190,.7),
        0 0 35px rgba(255,80,140,.4);
}


.title h1 {

    margin: 0;

    font-size: 38px;

    color: #fff0f6;

    animation:
        glow 5s ease-in-out infinite;
}


.title p {

    margin-top: 10px;

    font-size: 16px;

    color: #f4d9e5;

    opacity: .9;
}


@keyframes glow {

    0%,100% {

        text-shadow:
            0 0 12px rgba(255,150,190,.6);
    }

    50% {

        text-shadow:
            0 0 25px rgba(255,190,215,1),
            0 0 45px rgba(255,80,150,.5);
    }
}


/* =========================
   BOTTOM MESSAGE
========================= */

.message {

    position: fixed;

    bottom: 5%;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 10;

    pointer-events: none;
}


.message p {

    margin: 5px;

    color: #f8dce8;

    font-style: italic;

    font-size: 15px;
}


.poetry {

    direction: rtl;

    font-size: 20px;

    line-height: 1.8;

    max-width: 850px;

    margin: auto;

    color: #fff6fb;

    text-shadow:
        0 0 10px rgba(255,180,210,.3);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .title {

        top: 4%;
    }

    .title h1 {

        font-size: 27px;
    }

    .title p {

        font-size: 13px;
    }

    .message {

        bottom: 3%;
    }

    .poetry {

        font-size: 14px;

        padding: 0 15px;

        line-height: 1.6;
    }

    .message p {

        font-size: 11px;
    }

}

</style>

</head>


<body>


<div id="canvasContainer"></div>


<!-- =========================
     TITLE
========================= -->

<div class="title">

    <h1>
        A Rose For You 🌹
    </h1>

    <p>
        A little something made with code and a lot of love ❤️
    </p>

</div>


<!-- =========================
     MESSAGE
========================= -->

<div class="message">

    <div class="poetry">

        تیری مسکراہٹ سے مہک اٹھتا ہے دل،
        جیسے گلِ گلاب سے مہک اٹھے چمن۔ 🌹

        <br>

        تو پھولوں جیسی نہیں،
        پھول تو تیرے حسن کی بس ایک مثال ہیں۔ ✨

        <br>

        اور اگر محبت ایک خوبصورت دعا ہے،
        تو میری ہر دعا میں تیرا نام ہو۔ ❤️

    </div>

    <p>
        Drag the rose to look around 🌹
    </p>

</div>


<!-- =========================
     THREE.JS
========================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>


<script>

/* =========================================
   SCENE
========================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(0x070510);


/* =========================================
   CAMERA
========================================= */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );


camera.position.set(
    5,
    4,
    8
);


/* =========================================
   RENDERER
========================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


document
    .getElementById("canvasContainer")
    .appendChild(renderer.domElement);


/* =========================================
   CONTROLS
========================================= */

const controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping = true;

controls.dampingFactor = 0.04;

controls.minDistance = 4;

controls.maxDistance = 12;

controls.target.set(
    0,
    1.4,
    0
);


/* =========================================
   LIGHTS
========================================= */

const ambientLight =
    new THREE.AmbientLight(
        0xffffff,
        1.5
    );

scene.add(ambientLight);


const pinkLight =
    new THREE.PointLight(
        0xff5c9a,
        8,
        10
    );

pinkLight.position.set(
    3,
    4,
    3
);

scene.add(pinkLight);


const whiteLight =
    new THREE.PointLight(
        0xffffff,
        5,
        10
    );

whiteLight.position.set(
    -3,
    5,
    4
);

scene.add(whiteLight);


/* =========================================
   ROSE GROUP
========================================= */

const rose =
    new THREE.Group();

scene.add(rose);


/* =========================================
   STEM
========================================= */

const stemGeometry =
    new THREE.CylinderGeometry(
        .07,
        .11,
        4,
        16
    );


const stemMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x176b32,
        roughness: .7
    });


const stem =
    new THREE.Mesh(
        stemGeometry,
        stemMaterial
    );


stem.position.y =
    -0.3;

rose.add(stem);


/* =========================================
   LEAF FUNCTION
========================================= */

function createLeaf(
    x,
    y,
    z,
    rotation
) {

    const geometry =
        new THREE.SphereGeometry(
            0.7,
            20,
            10
        );


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x238a42,
            roughness: .65
        });


    const leaf =
        new THREE.Mesh(
            geometry,
            material
        );


    leaf.scale.set(
        1.5,
        .3,
        .55
    );


    leaf.position.set(
        x,
        y,
        z
    );


    leaf.rotation.z =
        rotation;


    rose.add(leaf);
}


createLeaf(
    -.45,
    -1.0,
    0,
    -.5
);


createLeaf(
    .45,
    -1.5,
    0,
    .5
);


/* =========================================
   PETAL FUNCTION
========================================= */

function createPetal(
    radius,
    height,
    angle,
    scale,
    color
) {

    const geometry =
        new THREE.SphereGeometry(
            1,
            24,
            16
        );


    const material =
        new THREE.MeshStandardMaterial({

            color: color,

            roughness: .45,

            metalness: .05
        });


    const petal =
        new THREE.Mesh(
            geometry,
            material
        );


    petal.scale.set(
        scale * 1.2,
        scale * .35,
        scale * .75
    );


    petal.position.set(

        Math.cos(angle) * radius,

        height,

        Math.sin(angle) * radius

    );


    petal.rotation.y =
        -angle;


    petal.rotation.x =
        -.2;


    rose.add(petal);
}


/* =========================================
   OUTER PETALS
========================================= */

const outerCount = 18;


for (
    let i = 0;
    i < outerCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        outerCount;


    createPetal(
        1.0,
        1.55,
        angle,
        1,
        0xd71950
    );
}


/* =========================================
   SECOND LAYER
========================================= */

const secondCount = 16;


for (
    let i = 0;
    i < secondCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        secondCount
        + .15;


    createPetal(
        .72,
        1.8,
        angle,
        .82,
        0xf02d62
    );
}


/* =========================================
   INNER PETALS
========================================= */

const innerCount = 12;


for (
    let i = 0;
    i < innerCount;
    i++
) {

    const angle =
        i *
        Math.PI * 2 /
        innerCount;


    createPetal(
        .43,
        2.0,
        angle,
        .62,
        0xa90935
    );
}


/* =========================================
   CENTER
========================================= */

const centerGeometry =
    new THREE.SphereGeometry(
        .35,
        24,
        24
    );


const centerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x78001e,
        roughness: .4
    });


const center =
    new THREE.Mesh(
        centerGeometry,
        centerMaterial
    );


center.position.y =
    2.15;


rose.add(center);


/* =========================================
   GLOW
========================================= */

const glowGeometry =
    new THREE.SphereGeometry(
        1.7,
        32,
        32
    );


const glowMaterial =
    new THREE.MeshBasicMaterial({

        color: 0xff3f79,

        transparent: true,

        opacity: .06
    });


const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );


glow.position.y =
    1.4;


rose.add(glow);


/* =========================================
   FLOATING HEARTS
========================================= */

for (
    let i = 0;
    i < 15;
    i++
) {

    const heart =
        document.createElement(
            "div"
        );

    heart.innerHTML =
        "❤️";

    heart.style.position =
        "fixed";

    heart.style.left =
        Math.random() * 100 + "%";

    heart.style.bottom =
        "-30px";

    heart.style.fontSize =
        15 +
        Math.random() * 18 +
        "px";

    heart.style.opacity =
        ".7";

    heart.style.pointerEvents =
        "none";

    heart.style.zIndex =
        "5";

    document.body.appendChild(
        heart
    );


    heart.animate(

        [
            {
                transform:
                    "translateY(0)",
                opacity: 0
            },

            {
                transform:
                    "translateY(-100vh)",
                opacity: .8
            },

            {
                transform:
                    "translateY(-110vh)",
                opacity: 0
            }
        ],

        {
            duration:
                7000 +
                Math.random() * 5000,

            delay:
                Math.random() * 5000,

            iterations:
                Infinity
        }

    );

}


/* =========================================
   ROSE ANIMATION
========================================= */

let time = 0;


function animate() {

    requestAnimationFrame(
        animate
    );


    time += .01;


    /*
       Very slow natural movement
    */

    rose.rotation.y +=
        .0015;


    rose.position.y =
        Math.sin(time) * .04;


    glow.scale.setScalar(
        1 +
        Math.sin(time * 2) * .04
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================
   RESPONSIVE
========================================= */

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>


</body>

</html>
