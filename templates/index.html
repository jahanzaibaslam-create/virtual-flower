<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Flower For You 🌸</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(#07152b, #102b46);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Moon */
        .moon {
            position: absolute;
            top: 10%;
            right: 12%;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #fff8d6;
            box-shadow: 0 0 40px rgba(255,255,220,0.6);
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 25%;
            background: #061d13;
        }

        /* Flower */
        .flower {
            position: absolute;
            left: 50%;
            top: 48%;
            width: 220px;
            height: 300px;
            transform: translate(-50%, -50%);
        }

        /* Stem */
        .stem {
            position: absolute;
            width: 12px;
            height: 190px;
            background: #2e9d50;
            left: 104px;
            top: 100px;
            border-radius: 10px;
            transform-origin: top;
            animation: growStem 2s ease-out forwards;
        }

        /* Center */
        .center {
            position: absolute;
            width: 70px;
            height: 70px;
            background: #ffd43b;
            border-radius: 50%;
            left: 75px;
            top: 55px;
            z-index: 5;
            box-shadow: 0 0 15px rgba(255,210,50,0.7);
        }

        /* Petals */
        .petal {
            position: absolute;
            width: 80px;
            height: 110px;
            background: #ff5c8a;
            border-radius: 50%;
            left: 70px;
            top: 35px;
            transform-origin: 40px 75px;
            opacity: 0;
            animation: bloom 1s ease forwards;
        }

        .p1 {
            transform: rotate(0deg) translateY(-55px);
            animation-delay: 0.8s;
        }

        .p2 {
            transform: rotate(72deg) translateY(-55px);
            animation-delay: 1s;
        }

        .p3 {
            transform: rotate(144deg) translateY(-55px);
            animation-delay: 1.2s;
        }

        .p4 {
            transform: rotate(216deg) translateY(-55px);
            animation-delay: 1.4s;
        }

        .p5 {
            transform: rotate(288deg) translateY(-55px);
            animation-delay: 1.6s;
        }

        /* Leaves */
        .leaf {
            position: absolute;
            width: 65px;
            height: 30px;
            background: #35b85a;
            border-radius: 100% 0 100% 0;
            top: 200px;
        }

        .leaf.left {
            left: 45px;
            transform: rotate(-25deg);
        }

        .leaf.right {
            right: 45px;
            transform: rotate(25deg) scaleX(-1);
        }

        /* Message */
        .message {
            position: absolute;
            bottom: 8%;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            animation: fadeIn 2s ease forwards;
            animation-delay: 2s;
            opacity: 0;
        }

        .submessage {
            font-size: 16px;
            font-weight: normal;
            margin-top: 10px;
            opacity: 0.85;
        }

        @keyframes bloom {
            from {
                opacity: 0;
                transform: scale(0);
            }

            to {
                opacity: 1;
            }
        }

        @keyframes growStem {
            from {
                height: 0;
            }

            to {
                height: 190px;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<div class="scene">

    <div class="moon"></div>

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>

        <div class="center"></div>

    </div>

    <div class="ground"></div>

    <div class="message">
        A little flower for you 🌸❤️

        <div class="submessage">
            Because you deserve something beautiful.
        </div>
    </div>

</div>

</body>
</html>
