<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Eman Nasir ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    min-height: 100vh;

    background:
        radial-gradient(circle at 50% 35%, #302060 0%, #11142f 45%, #050711 100%);

    font-family: Georgia, "Times New Roman", serif;
    color: white;
}

/* ================= SCENE ================= */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* ================= STARS ================= */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;

    animation: twinkle 2s infinite alternate;
}

.s1 { left: 8%; top: 15%; animation-delay: .2s; }
.s2 { left: 18%; top: 28%; animation-delay: .8s; }
.s3 { left: 30%; top: 10%; animation-delay: .4s; }
.s4 { left: 48%; top: 18%; animation-delay: 1s; }
.s5 { left: 65%; top: 12%; animation-delay: .5s; }
.s6 { left: 78%; top: 25%; animation-delay: 1.3s; }
.s7 { left: 90%; top: 12%; animation-delay: .7s; }
.s8 { left: 85%; top: 40%; animation-delay: 1.1s; }
.s9 { left: 12%; top: 45%; animation-delay: .9s; }
.s10 { left: 72%; top: 45%; animation-delay: .3s; }

@keyframes twinkle {

    from {
        opacity: .2;
        transform: scale(.6);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* ================= MOON ================= */

.moon {
    position: absolute;

    top: 7%;
    right: 10%;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    background: #fff7d0;

    box-shadow:
        0 0 25px #fff7d0,
        0 0 60px rgba(255,240,180,.5);
}

/* ================= MAIN FLOWER ================= */

.flower {
    position: absolute;

    left: 50%;
    top: 43%;

    width: 240px;
    height: 340px;

    transform: translate(-50%, -50%);

    animation: flowerSway 4s ease-in-out infinite;
}

@keyframes flowerSway {

    0%,100% {
        transform: translate(-50%, -50%) rotate(-2deg);
    }

    50% {
        transform: translate(-50%, -50%) rotate(2deg);
    }
}

/* ================= STEM ================= */

.stem {

    position: absolute;

    left: 114px;
    top: 105px;

    width: 12px;
    height: 200px;

    border-radius: 20px;

    background:
        linear-gradient(
            to right,
            #145c30,
            #62dc7d,
            #145c30
        );

    transform-origin: top;

    animation: stemGrow 2s ease forwards;
}

@keyframes stemGrow {

    from {
        height: 0;
    }

    to {
        height: 200px;
    }
}

/* ================= PETALS ================= */

.petal {

    position: absolute;

    left: 80px;
    top: 40px;

    width: 85px;
    height: 115px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ffb8d2,
            #ff4f8b 55%,
            #c91458
        );

    transform-origin: 42px 78px;

    opacity: 0;

    box-shadow:
        0 0 18px rgba(255,70,140,.55);

    animation: bloom 1s ease forwards;
}

.p1 {
    transform: rotate(0deg) translateY(-58px);
    animation-delay: .5s;
}

.p2 {
    transform: rotate(72deg) translateY(-58px);
    animation-delay: .7s;
}

.p3 {
    transform: rotate(144deg) translateY(-58px);
    animation-delay: .9s;
}

.p4 {
    transform: rotate(216deg) translateY(-58px);
    animation-delay: 1.1s;
}

.p5 {
    transform: rotate(288deg) translateY(-58px);
    animation-delay: 1.3s;
}

@keyframes bloom {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
    }
}

/* ================= FLOWER CENTER ================= */

.center {

    position: absolute;

    left: 87px;
    top: 62px;

    width: 72px;
    height: 72px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff28a,
            #ffc928
        );

    box-shadow:
        0 0 25px #ffd83d;

    z-index: 10;

    animation: heartbeat 2s infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* ================= LEAVES ================= */

.leaf {

    position: absolute;

    width: 75px;
    height: 34px;

    background:
        linear-gradient(
            135deg,
            #69e58b,
            #168d42
        );

    border-radius: 100% 0 100% 0;
}

.leaf.left {

    left: 48px;
    top: 215px;

    transform: rotate(-25deg);
}

.leaf.right {

    right: 48px;
    top: 240px;

    transform: rotate(155deg);
}

/* ================= ROSES ================= */

.rose {

    position: absolute;

    font-size: 55px;

    filter:
        drop-shadow(0 0 10px rgba(255,40,90,.7));

    animation:
        roseAppear 2s ease forwards,
        roseFloat 4s ease-in-out infinite;
}

.rose1 {
    left: 8%;
    bottom: 15%;
    animation-delay: 1s;
}

.rose2 {
    left: 20%;
    bottom: 8%;
    animation-delay: 1.5s;
}

.rose3 {
    right: 20%;
    bottom: 10%;
    animation-delay: 2s;
}

.rose4 {
    right: 7%;
    bottom: 17%;
    animation-delay: 2.5s;
}

@keyframes roseAppear {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes roseFloat {

    0%,100% {
        margin-top: 0;
    }

    50% {
        margin-top: -12px;
    }
}

/* ================= FALLING PETALS ================= */

.fallingPetal {

    position: absolute;

    top: -30px;

    font-size: 22px;

    animation: fall 7s linear infinite;

    opacity: 0;
}

.fp1 {
    left: 12%;
    animation-delay: 1s;
}

.fp2 {
    left: 30%;
    animation-delay: 3s;
}

.fp3 {
    left: 55%;
    animation-delay: 2s;
}

.fp4 {
    left: 75%;
    animation-delay: 4s;
}

.fp5 {
    left: 90%;
    animation-delay: 5s;
}

@keyframes fall {

    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

/* ================= HEARTS ================= */

.heart {

    position: absolute;

    bottom: -30px;

    font-size: 25px;

    animation: heartFloat 7s linear infinite;

    opacity: 0;
}

.h1 {
    left: 15%;
    animation-delay: 1s;
}

.h2 {
    left: 38%;
    animation-delay: 3s;
}

.h3 {
    left: 68%;
    animation-delay: 2s;
}

.h4 {
    left: 85%;
    animation-delay: 4s;
}

@keyframes heartFloat {

    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-100vh) scale(1.3);
        opacity: 0;
    }
}

/* ================= SPARKLES ================= */

.sparkle {

    position: absolute;

    font-size: 22px;

    animation: sparkle 3s infinite;
}

.sp1 {
    left: 12%;
    top: 50%;
}

.sp2 {
    right: 12%;
    top: 50%;
    animation-delay: 1s;
}

.sp3 {
    right: 25%;
    top: 30%;
    animation-delay: 2s;
}

@keyframes sparkle {

    0%,100% {
        opacity: .2;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* ================= TEXT ================= */

.message {

    position: absolute;

    left: 0;
    bottom: 5%;

    width: 100%;

    text-align: center;

    padding: 0 15px;

    animation: messageIn 3s ease forwards;

    opacity: 0;
}

.name {

    font-size: 32px;

    font-weight: bold;

    color: #ffd6e5;

    text-shadow:
        0 0 10px rgba(255,100,160,.8),
        0 0 25px rgba(255,70,140,.5);

    margin-bottom: 10px;
}

.urdu {

    font-size: 24px;

    line-height: 1.8;

    direction: rtl;

    color: #fff;

    text-shadow:
        0 0 12px rgba(255,255,255,.35);
}

.english {

    margin-top: 8px;

    font-size: 16px;

    font-style: italic;

    opacity: .85;
}

@keyframes messageIn {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .moon {
        width: 55px;
        height: 55px;
        right: 7%;
    }

    .flower {
        transform: translate(-50%, -50%) scale(.78);
    }

    .name {
        font-size: 25px;
    }

    .urdu {
        font-size: 19px;
    }

    .english {
        font-size: 14px;
    }

    .rose {
        font-size: 38px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- STARS -->

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>
    <div class="star s9"></div>
    <div class="star s10"></div>

    <!-- MOON -->

    <div class="moon"></div>

    <!-- MAIN FLOWER -->

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>

        <div class="center"></div>

    </div>

    <!-- ROSES / GULAB -->

    <div class="rose rose1">🌹</div>
    <div class="rose rose2">🌹</div>
    <div class="rose rose3">🌹</div>
    <div class="rose rose4">🌹</div>

    <!-- FALLING ROSE PETALS -->

    <div class="fallingPetal fp1">🌹</div>
    <div class="fallingPetal fp2">🌸</div>
    <div class="fallingPetal fp3">🌹</div>
    <div class="fallingPetal fp4">🌸</div>
    <div class="fallingPetal fp5">🌹</div>

    <!-- FLOATING HEARTS -->

    <div class="heart h1">❤️</div>
    <div class="heart h2">💕</div>
    <div class="heart h3">❤️</div>
    <div class="heart h4">💗</div>

    <!-- SPARKLES -->

    <div class="sparkle sp1">✨</div>
    <div class="sparkle sp2">✨</div>
    <div class="sparkle sp3">⭐</div>

    <!-- MESSAGE -->

    <div class="message">

        <div class="name">
            Eman Nasir ❤️
        </div>

        <div class="urdu">
            تیری مسکراہٹ سے مہک اٹھتا ہے دل،
            جیسے گلِ گلاب سے مہک اٹھے چمن۔ 🌹
        </div>

        <div class="english">
            A little flower for you,you are an amazing person , a dream… because you deserve
            all the beautiful things in this world. ❤️
        </div>

    </div>

</div>

</body>
</html>
