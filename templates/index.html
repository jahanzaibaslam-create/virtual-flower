<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 A Rose For You 🌹</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 70%, #32101e 0%, #12060d 45%, #020205 100%);
        font-family: Georgia, serif;
        color: white;
    }

    #scene {
        position: fixed;
        inset: 0;
    }

    .message {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 10;
        width: 90%;
        pointer-events: none;
    }

    .message h1 {
        font-size: clamp(28px, 5vw, 55px);
        font-weight: normal;
        letter-spacing: 2px;
        text-shadow: 0 0 20px rgba(255,100,150,.8);
        opacity: 0;
        animation: appear 2s ease forwards;
        animation-delay: 10s;
    }

    .message p {
        margin-top: 12px;
        font-size: clamp(15px, 2vw, 22px);
        opacity: 0;
        animation: appear 2s ease forwards;
        animation-delay: 12s;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(15px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .loading {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,.65);
        font-size: 14px;
        z-index: 20;
        letter-spacing: 2px;
    }
</style>
</head>

<body>

<div id="scene"></div>

<div class="message">
    <h1>🌹 A Rose For You 🌹</h1>
    <p>
        کچھ پھول وقت کے ساتھ مرجھا جاتے ہیں،
        مگر کچھ یادیں ہمیشہ مہکتی رہتی ہیں۔
    </p>
</div>

<div class="loading" id="loading">
    A rose is being created...
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 1.8, 9);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

document.getElementById("scene").appendChild(renderer.domElement);


// =====================================================
// LIGHTS
// =====================================================

const ambient = new THREE.AmbientLight(0xffb0c8, 1.3);
scene.add(ambient);

const mainLight = new THREE.PointLight(0xff477e, 5, 20);
mainLight.position.set(3, 5, 4);
scene.add(mainLight);

const softLight = new THREE.PointLight(0xffd0dc, 3, 15);
softLight.position.set(-3, 3, 2);
scene.add(softLight);


// =====================================================
// ROSE GROUP
// =====================================================

const rose = new THREE.Group();
rose.position.y = -3.2;

scene.add(rose);


// =====================================================
// STEM
// =====================================================

const stemHeight = 5.2;

const stemGeometry = new THREE.CylinderGeometry(
    0.075,
    0.11,
    stemHeight,
    16
);

const stemMaterial = new THREE.MeshStandardMaterial({
    color: 0x174d25,
    roughness: 0.8
});

const stem = new THREE.Mesh(
    stemGeometry,
    stemMaterial
);

stem.position.y = stemHeight / 2;
stem.scale.y = 0.001;

rose.add(stem);


// =====================================================
// GROUND
// =====================================================

const groundGeometry = new THREE.CircleGeometry(4, 64);

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x16070d,
    transparent: true,
    opacity: 0.8
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;

rose.add(ground);


// =====================================================
// LEAVES
// =====================================================

const leaves = [];

function createLeaf(side, height, rotation) {

    const geometry = new THREE.SphereGeometry(
        0.55,
        20,
        12
    );

    const material = new THREE.MeshStandardMaterial({
        color: 0x176b35,
        roughness: 0.7
    });

    const leaf = new THREE.Mesh(
        geometry,
        material
    );

    leaf.scale.set(0.08, 0.35, 0.75);

    leaf.position.set(
        side * 0.55,
        height,
        0
    );

    leaf.rotation.z = rotation;
    leaf.rotation.y = side * 0.5;

    leaf.scale.set(0.001, 0.001, 0.001);

    rose.add(leaf);

    leaves.push(leaf);
}

createLeaf(-1, 1.5, -0.7);
createLeaf(1, 2.2, 0.7);
createLeaf(-1, 3.0, -0.7);
createLeaf(1, 3.7, 0.7);


// =====================================================
// ROSE BUD
// =====================================================

const budGroup = new THREE.Group();

budGroup.position.y = stemHeight + 0.1;

rose.add(budGroup);


// =====================================================
// PETAL CREATION
// =====================================================

const petals = [];

function createPetal(
    radius,
    angle,
    height,
    scale,
    delay,
    tilt
) {

    const geometry = new THREE.SphereGeometry(
        0.8,
        24,
        18
    );

    const material = new THREE.MeshPhysicalMaterial({
        color: 0xb5123c,
        roughness: 0.45,
        metalness: 0.05,
        clearcoat: 0.4,
        clearcoatRoughness: 0.3,
        side: THREE.DoubleSide
    });

    const petal = new THREE.Mesh(
        geometry,
        material
    );

    petal.position.set(
        Math.cos(angle) * radius,
        height,
        Math.sin(angle) * radius
    );

    petal.scale.set(
        0.001,
        0.001,
        0.001
    );

    petal.rotation.y = angle;
    petal.rotation.x = tilt;

    budGroup.add(petal);

    petals.push({
        mesh: petal,
        radius,
        angle,
        height,
        scale,
        delay,
        tilt
    });
}


// =====================================================
// OUTER PETALS
// =====================================================

const outerCount = 14;

for(let i = 0; i < outerCount; i++) {

    const angle =
        (i / outerCount) * Math.PI * 2;

    createPetal(
        0.48,
        angle,
        0,
        1.05,
        4.5 + i * 0.22,
        0.55
    );
}


// =====================================================
// SECOND PETAL LAYER
// =====================================================

const secondCount = 12;

for(let i = 0; i < secondCount; i++) {

    const angle =
        (i / secondCount) * Math.PI * 2
        + 0.2;

    createPetal(
        0.32,
        angle,
        0.18,
        0.88,
        7.5 + i * 0.18,
        0.38
    );
}


// =====================================================
// INNER PETALS
// =====================================================

const innerCount = 9;

for(let i = 0; i < innerCount; i++) {

    const angle =
        (i / innerCount) * Math.PI * 2;

    createPetal(
        0.16,
        angle,
        0.36,
        0.68,
        9.2 + i * 0.15,
        0.22
    );
}


// =====================================================
// CENTER
// =====================================================

const centerGeometry =
    new THREE.SphereGeometry(0.18, 20, 20);

const centerMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x7d0928,
        roughness: 0.5
    });

const center =
    new THREE.Mesh(
        centerGeometry,
        centerMaterial
    );

center.scale.set(0.001,0.001,0.001);

center.position.y = 0.48;

budGroup.add(center);


// =====================================================
// FLOATING HEARTS
// =====================================================

const hearts = [];

function heartShape() {

    const shape = new THREE.Shape();

    shape.moveTo(0, 0);

    shape.bezierCurveTo(
        -0.5, 0.5,
        -1, -0.1,
        0, -0.8
    );

    shape.bezierCurveTo(
        1, -0.1,
        0.5, 0.5,
        0, 0
    );

    return shape;
}

function createHeart() {

    const geometry =
        new THREE.ShapeGeometry(heartShape());

    const material =
        new THREE.MeshBasicMaterial({
            color: 0xff477e,
            transparent: true,
            opacity: 0.7,
            side: THREE.DoubleSide
        });

    const heart =
        new THREE.Mesh(
            geometry,
            material
        );

    heart.position.set(
        (Math.random()-0.5)*8,
        -2 + Math.random()*5,
        (Math.random()-0.5)*3
    );

    heart.scale.setScalar(
        0.04 + Math.random()*0.08
    );

    scene.add(heart);

    hearts.push({
        mesh: heart,
        speed: 0.002 + Math.random()*0.004
    });
}

for(let i=0; i<18; i++) {
    createHeart();
}


// =====================================================
// STARS
// =====================================================

const starGeometry =
    new THREE.BufferGeometry();

const starPositions = [];

for(let i=0; i<400; i++) {

    starPositions.push(
        (Math.random()-0.5)*20,
        (Math.random()-0.5)*12,
        -Math.random()*8
    );
}

starGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.025,
        transparent: true,
        opacity: 0.7
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


// =====================================================
// ANIMATION CLOCK
// =====================================================

const clock = new THREE.Clock();


// =====================================================
// SMOOTH STEP
// =====================================================

function easeOut(t) {

    return 1 - Math.pow(1-t, 3);
}


// =====================================================
// MAIN ANIMATION
// =====================================================

function animate() {

    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();

    // -----------------------------------------------
    // STEM GROWTH
    // -----------------------------------------------

    let stemProgress =
        Math.min(elapsed / 4, 1);

    stem.scale.y =
        Math.max(0.001, easeOut(stemProgress));


    // -----------------------------------------------
    // LEAF GROWTH
    // -----------------------------------------------

    leaves.forEach((leaf, i) => {

        const start = 3.0 + i * 0.7;

        let p =
            Math.min(
                Math.max(
                    (elapsed-start)/1.2,
                    0
                ),
                1
            );

        p = easeOut(p);

        leaf.scale.set(
            p * 0.08,
            p * 0.35,
            p * 0.75
        );
    });


    // -----------------------------------------------
    // BUD APPEARS
    // -----------------------------------------------

    let budProgress =
        Math.min(
            Math.max((elapsed-3.8)/2,0),
            1
        );

    budProgress = easeOut(budProgress);

    budGroup.scale.setScalar(
        budProgress
    );


    // -----------------------------------------------
    // PETAL BLOOM
    // -----------------------------------------------

    petals.forEach((p) => {

        let progress =
            Math.min(
                Math.max(
                    (elapsed-p.delay)/1.3,
                    0
                ),
                1
            );

        progress = easeOut(progress);

        const s =
            p.scale * progress;

        p.mesh.scale.set(
            s,
            s * 0.55,
            s
        );


        // petals move outward while opening
        const currentRadius =
            p.radius * progress;

        p.mesh.position.x =
            Math.cos(p.angle) * currentRadius;

        p.mesh.position.z =
            Math.sin(p.angle) * currentRadius;


        // petals unfold upward
        p.mesh.rotation.x =
            p.tilt * (1-progress);

        p.mesh.rotation.y =
            p.angle;
    });


    // -----------------------------------------------
    // CENTER APPEARS
    // -----------------------------------------------

    let centerProgress =
        Math.min(
            Math.max((elapsed-10)/1,0),
            1
        );

    centerProgress =
        easeOut(centerProgress);

    center.scale.setScalar(
        centerProgress
    );


    // -----------------------------------------------
    // FINAL ROSE BREATHING
    // -----------------------------------------------

    if(elapsed > 11) {

        const breathe =
            1 + Math.sin(elapsed*1.5)*0.025;

        budGroup.scale.setScalar(
            breathe
        );

        rose.rotation.y =
            Math.sin(elapsed*0.35)*0.12;

        rose.rotation.z =
            Math.sin(elapsed*0.7)*0.015;
    }


    // -----------------------------------------------
    // MOVING LIGHT
    // -----------------------------------------------

    mainLight.position.x =
        Math.sin(elapsed*0.5)*4;

    mainLight.position.z =
        Math.cos(elapsed*0.5)*4;


    // -----------------------------------------------
    // HEARTS
    // -----------------------------------------------

    hearts.forEach(h => {

        h.mesh.position.y += h.speed;

        h.mesh.rotation.z += 0.003;

        if(h.mesh.position.y > 5) {
            h.mesh.position.y = -3;
        }
    });


    // -----------------------------------------------
    // STARS
    // -----------------------------------------------

    stars.rotation.y =
        elapsed * 0.015;


    renderer.render(
        scene,
        camera
    );
}

animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


// =====================================================
// MOUSE / TOUCH ROTATION
// =====================================================

let dragging = false;
let previousX = 0;

renderer.domElement.addEventListener(
    "pointerdown",
    e => {
        dragging = true;
        previousX = e.clientX;
    }
);

renderer.domElement.addEventListener(
    "pointerup",
    () => {
        dragging = false;
    }
);

renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(!dragging) return;

        const movement =
            e.clientX - previousX;

        rose.rotation.y +=
            movement * 0.008;

        previousX = e.clientX;
    }
);


// =====================================================
// LOADING TEXT
// =====================================================

setTimeout(() => {

    document.getElementById("loading")
        .innerText =
        "🌱 Growing...";

}, 1000);

setTimeout(() => {

    document.getElementById("loading")
        .innerText =
        "🌿 Growing leaves...";

}, 3500);

setTimeout(() => {

    document.getElementById("loading")
        .innerText =
        "🌹 Blooming...";

}, 6000);

setTimeout(() => {

    document.getElementById("loading")
        .innerText =
        "❤️";

}, 11000);

</script>

</body>
</html>
