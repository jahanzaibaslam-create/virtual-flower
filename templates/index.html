<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌹 A Rose Among The Stars 🌌</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010105;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    position: relative;
    color: white;
}

#space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 50%,
        #170008 0%,
        #060009 45%,
        #010105 100%);
}

.star {
    position: absolute;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px white;
    animation: twinkle linear infinite;
}

.star.red {
    background: #ff1744;
    box-shadow: 0 0 10px #ff1744;
}

.star.blue {
    background: #55caff;
    box-shadow: 0 0 10px #55caff;
}

.star.pink {
    background: #ff72bb;
    box-shadow: 0 0 10px #ff72bb;
}

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.6);
    }
    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

.moon {
    position: absolute;
    width: 100px;
    height: 100px;
    right: 9%;
    top: 10%;
    border-radius: 50%;
    background:
        radial-gradient(circle at 35% 30%,
        #fff,
        #ddd 45%,
        #888 100%);
    box-shadow:
        0 0 20px white,
        0 0 50px rgba(255,255,255,.4);
    animation: moonFloat 8s ease-in-out infinite;
}

@keyframes moonFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
}

.planet {
    position: absolute;
    border-radius: 50%;
    animation: planetFloat ease-in-out infinite;
}

.planet1 {
    width: 80px;
    height: 80px;
    left: 8%;
    top: 20%;
    background:
        radial-gradient(circle at 30% 25%,
        #ff8cff,
        #7b21a8 45%,
        #23002f 100%);
    box-shadow: 0 0 30px rgba(200,50,255,.7);
    animation-duration: 9s;
}

.planet2 {
    width: 60px;
    height: 60px;
    right: 17%;
    bottom: 18%;
    background:
        radial-gradient(circle at 30% 25%,
        #ffcc80,
        #ff5722 50%,
        #5c1200 100%);
    box-shadow: 0 0 30px rgba(255,100,30,.6);
    animation-duration: 11s;
}

.planet3 {
    width: 42px;
    height: 42px;
    left: 20%;
    bottom: 18%;
    background:
        radial-gradient(circle at 30% 25%,
        #9eeaff,
        #1976d2 50%,
        #001c45 100%);
    box-shadow: 0 0 25px rgba(50,150,255,.6);
    animation-duration: 7s;
}

@keyframes planetFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-25px) rotate(15deg);
    }
}

.ring {
    position: absolute;
    width: 150%;
    height: 35%;
    left: -25%;
    top: 32%;
    border: 3px solid rgba(255,190,100,.7);
    border-radius: 50%;
    transform: rotate(-18deg);
}

.title {
    position: fixed;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 95%;
    text-align: center;
    font-size: clamp(22px,4vw,42px);
    letter-spacing: 2px;
    text-shadow:
        0 0 8px #ff0033,
        0 0 25px #ff0033,
        0 0 50px #ff0033;
}

.subtitle {
    position: fixed;
    top: 78px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 90%;
    text-align: center;
    color: #ffc5d0;
    font-size: clamp(14px,2vw,19px);
    text-shadow: 0 0 10px #ff1744;
}

#canvas-container {
    position: fixed;
    inset: 0;
    z-index: 5;
    cursor: grab;
}

#canvas-container:active {
    cursor: grabbing;
}

canvas {
    display: block;
}

.message {
    position: fixed;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    z-index: 30;
    width: 90%;
    max-width: 750px;
    text-align: center;
    opacity: 0;
    transition: opacity 3s ease, transform 3s ease;
    pointer-events: none;
}

.message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(-10px);
}

.message .english {
    font-size: clamp(18px,3vw,28px);
    text-shadow:
        0 0 10px #ff0033,
        0 0 25px #ff0033;
}

.message .urdu {
    margin-top: 10px;
    font-size: clamp(18px,3vw,27px);
    direction: rtl;
    color: #ffb6c5;
    text-shadow: 0 0 15px #ff1744;
}

.hint {
    position: fixed;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    z-index: 30;
    font-family: Arial,sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,.5);
    letter-spacing: 1px;
}

.heart {
    position: fixed;
    z-index: 10;
    color: #ff1744;
    pointer-events: none;
    text-shadow:
        0 0 8px #ff1744,
        0 0 20px #ff1744;
    animation: heartFloat linear forwards;
}

@keyframes heartFloat {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(-100vh) scale(1.3) rotate(25deg);
        opacity: 0;
    }
}

@media(max-width:600px) {

    .moon {
        width: 65px;
        height: 65px;
        right: 5%;
        top: 13%;
    }

    .planet1 {
        width: 50px;
        height: 50px;
        left: 4%;
    }

    .planet2 {
        width: 40px;
        height: 40px;
        right: 8%;
    }

    .planet3 {
        width: 30px;
        height: 30px;
    }
}
</style>
</head>

<body>

<div id="space"></div>

<div class="moon"></div>

<div class="planet planet1">
    <div class="ring"></div>
</div>

<div class="planet planet2"></div>
<div class="planet planet3"></div>

<div class="title">
    🌹 A Rose Among The Stars 🌌
</div>

<div class="subtitle">
    Some flowers are beautiful... but some are made for someone special ❤️
</div>

<div id="canvas-container"></div>

<div class="message" id="message">

    <div class="english">
        If I could give you one thing in this universe...
        <br>
        I'd give you this rose. 🌹
    </div>

    <div class="urdu">
        تم پھول نہیں، وہ خوشبو ہو جو دل میں ہمیشہ رہتی ہے ❤️
    </div>

</div>

<div class="hint">
    ✨ Drag the rose • Touch & drag on phone ✨
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   STARS
===================================================== */

const space = document.getElementById("space");

for(let i = 0; i < 1000; i++){

    const star = document.createElement("div");

    star.className = "star";

    const size = .5 + Math.random() * 2.2;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDuration =
        2 + Math.random() * 5 + "s";

    star.style.animationDelay =
        Math.random() * 5 + "s";

    const type = Math.random();

    if(type < .05)
        star.classList.add("red");

    else if(type < .10)
        star.classList.add("blue");

    else if(type < .15)
        star.classList.add("pink");

    space.appendChild(star);
}


/* =====================================================
   THREE JS
===================================================== */

const container =
    document.getElementById("canvas-container");

const scene =
    new THREE.Scene();

const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth / window.innerHeight,
        .1,
        1000
    );

camera.position.set(
    0,
    .4,
    11
);

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:true
    });

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(
    0x010105,
    0
);

container.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTS
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffd0d8,
        1.8
    )
);

const whiteLight =
    new THREE.PointLight(
        0xffffff,
        3,
        50
    );

whiteLight.position.set(
    4,5,6
);

scene.add(whiteLight);

const roseLight =
    new THREE.PointLight(
        0xff0033,
        15,
        20
    );

roseLight.position.set(
    0,1,2
);

scene.add(roseLight);


/* =====================================================
   ROSE
===================================================== */

const rose =
    new THREE.Group();

rose.position.y = -0.8;

scene.add(rose);


/* =====================================================
   MATERIALS
===================================================== */

const redOuter =
    new THREE.MeshPhysicalMaterial({

        color:0xff002b,

        roughness:.3,

        metalness:.02,

        clearcoat:1,

        clearcoatRoughness:.08,

        emissive:0x65000f,

        emissiveIntensity:.65,

        side:THREE.DoubleSide
    });


const redMiddle =
    new THREE.MeshPhysicalMaterial({

        color:0xff003d,

        roughness:.26,

        metalness:.01,

        clearcoat:1,

        clearcoatRoughness:.07,

        emissive:0x800018,

        emissiveIntensity:.7,

        side:THREE.DoubleSide
    });


const redInner =
    new THREE.MeshPhysicalMaterial({

        color:0xff174f,

        roughness:.22,

        metalness:.01,

        clearcoat:1,

        clearcoatRoughness:.06,

        emissive:0xa00024,

        emissiveIntensity:.8,

        side:THREE.DoubleSide
    });


/* =====================================================
   REALISTIC PETAL SHAPE
===================================================== */

function makePetal(
    width,
    height,
    depth
){

    const shape =
        new THREE.Shape();

    /*
       This creates a pointed,
       curved rose-petal outline.
    */

    shape.moveTo(0,0);

    shape.bezierCurveTo(
        -width*.75,
        height*.15,
        -width*.9,
        height*.75,
        0,
        height
    );

    shape.bezierCurveTo(
        width*.9,
        height*.75,
        width*.75,
        height*.15,
        0,
        0
    );


    const geometry =
        new THREE.ExtrudeGeometry(
            shape,
            {
                depth:depth,
                bevelEnabled:true,
                bevelSegments:3,
                bevelSize:.035,
                bevelThickness:.025,
                curveSegments:8
            }
        );


    geometry.center();

    return geometry;
}


/* =====================================================
   PETAL LAYER
===================================================== */

function createPetalLayer(
    count,
    radius,
    width,
    height,
    depth,
    material,
    y,
    tilt,
    delayStart
){

    const petals = [];


    for(let i=0;i<count;i++){

        const angle =
            i / count *
            Math.PI * 2;


        const geometry =
            makePetal(
                width,
                height,
                depth
            );


        const petal =
            new THREE.Mesh(
                geometry,
                material
            );


        petal.userData.finalX =
            Math.cos(angle) * radius;

        petal.userData.finalZ =
            Math.sin(angle) * radius;

        petal.userData.finalY =
            y;

        petal.userData.angle =
            angle;

        petal.userData.delay =
            delayStart + i*.07;


        /*
           Every petal begins at the center.
        */

        petal.position.set(
            0,
            y*.15,
            0
        );


        /*
           Rotate each petal around
           the rose naturally.
        */

        petal.rotation.y =
            angle;

        petal.rotation.x =
            tilt;

        petal.rotation.z =
            Math.sin(angle*2)*.18;


        petal.scale.set(
            .02,
            .02,
            .02
        );


        rose.add(petal);

        petals.push(petal);
    }


    return petals;
}


/* =====================================================
   OUTER ROSE PETALS
===================================================== */

const outerPetals =
    createPetalLayer(
        18,
        1.15,
        .9,
        1.65,
        .12,
        redOuter,
        .65,
        -.28,
        .2
    );


/* =====================================================
   SECOND PETAL LAYER
===================================================== */

const secondPetals =
    createPetalLayer(
        16,
        .82,
        .78,
        1.5,
        .115,
        redMiddle,
        .78,
        -.38,
        1.35
    );


/* =====================================================
   THIRD PETAL LAYER
===================================================== */

const thirdPetals =
    createPetalLayer(
        13,
        .55,
        .65,
        1.3,
        .11,
        redInner,
        .9,
        -.48,
        2.35
    );


/* =====================================================
   INNER CUP PETALS
===================================================== */

const innerPetals =
    createPetalLayer(
        9,
        .32,
        .52,
        1.0,
        .1,
        redInner,
        1.02,
        -.6,
        3.15
    );


const allPetals = [
    ...outerPetals,
    ...secondPetals,
    ...thirdPetals,
    ...innerPetals
];


/* =====================================================
   ROSE CENTER
===================================================== */

const centerGeometry =
    new THREE.SphereGeometry(
        .28,
        32,
        20
    );

const centerMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0xff0033,

        emissive:0xff0022,

        emissiveIntensity:1.5,

        roughness:.2,

        clearcoat:1
    });

const center =
    new THREE.Mesh(
        centerGeometry,
        centerMaterial
    );

center.position.y =
    1.05;

center.scale.setScalar(.01);

rose.add(center);


/* =====================================================
   CURLED INNER PETALS
===================================================== */

const curls = [];

for(let i=0;i<7;i++){

    const geometry =
        new THREE.TorusGeometry(
            .13 + i*.025,
            .025,
            12,
            32,
            Math.PI*1.6
        );

    const curl =
        new THREE.Mesh(
            geometry,
            redInner
        );

    curl.position.y =
        1.03 + i*.018;

    curl.rotation.x =
        Math.PI/2;

    curl.rotation.z =
        i*.85;

    curl.scale.setScalar(.01);

    rose.add(curl);

    curls.push(curl);
}


/* =====================================================
   STEM
===================================================== */

const stemGeometry =
    new THREE.CylinderGeometry(
        .075,
        .12,
        4.6,
        24
    );

const stemMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0x08752a,

        roughness:.6,

        emissive:0x002d0d,

        emissiveIntensity:.3
    });

const stem =
    new THREE.Mesh(
        stemGeometry,
        stemMaterial
    );

stem.position.y =
    -1.65;

rose.add(stem);


/* =====================================================
   LEAVES
===================================================== */

function leaf(
    x,
    y,
    rotation
){

    const geometry =
        new THREE.SphereGeometry(
            1,
            24,
            16
        );

    geometry.scale(
        .75,
        .13,
        .32
    );

    const material =
        new THREE.MeshPhysicalMaterial({

            color:0x07912e,

            roughness:.55,

            emissive:0x002c0c,

            emissiveIntensity:.25,

            side:THREE.DoubleSide
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        0
    );

    mesh.rotation.z =
        rotation;

    rose.add(mesh);
}

leaf(-.48,-1.0,-.45);
leaf(.48,-1.45,.45);
leaf(-.38,-2.05,-.5);


/* =====================================================
   GROUND GLOW
===================================================== */

const glow =
    new THREE.Mesh(
        new THREE.CircleGeometry(
            2.3,
            64
        ),
        new THREE.MeshBasicMaterial({

            color:0xff0033,

            transparent:true,

            opacity:.14,

            side:THREE.DoubleSide
        })
    );

glow.rotation.x =
    -Math.PI/2;

glow.position.y =
    -3.95;

rose.add(glow);


/* =====================================================
   BLOOM ANIMATION
===================================================== */

const beginning =
    performance.now();

function bloom(time){

    const seconds =
        (time-beginning)/1000;


    allPetals.forEach(
        petal => {

            const d =
                petal.userData;


            let p =
                (seconds-d.delay)/1.35;


            p =
                Math.max(
                    0,
                    Math.min(1,p)
                );


            /*
               Smooth bloom.
            */

            const ease =
                1-Math.pow(1-p,3);


            petal.position.x =
                d.finalX * ease;

            petal.position.z =
                d.finalZ * ease;

            petal.position.y =
                d.finalY +
                Math.sin(ease*Math.PI)*.15;


            petal.scale.set(
                ease,
                ease,
                ease
            );


            /*
               Petals slowly open.
            */

            petal.rotation.x =
                d.finalX > 0
                ? -.28 + ease*.25
                : -.28 + ease*.25;
        }
    );


    const centerP =
        Math.max(
            0,
            Math.min(
                1,
                (seconds-3.5)/1
            )
        );


    center.scale.setScalar(
        1-Math.pow(1-centerP,3)
    );


    curls.forEach(
        (curl,i)=>{

            const p =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (seconds-3.8-i*.05)/1
                    )
                );

            curl.scale.setScalar(
                1-Math.pow(1-p,3)
            );
        }
    );
}


/* =====================================================
   DRAG
===================================================== */

let dragging = false;

let lastX = 0;
let lastY = 0;

let rotationY = 0;
let rotationX = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    e => {

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e => {

        if(!dragging)
            return;

        const dx =
            e.clientX-lastX;

        const dy =
            e.clientY-lastY;

        rotationY +=
            dx*.012;

        rotationX +=
            dy*.008;

        rotationX =
            Math.max(
                -1,
                Math.min(
                    1,
                    rotationX
                )
            );

        lastX =
            e.clientX;

        lastY =
            e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    e => {

        dragging = false;

        try {
            renderer.domElement.releasePointerCapture(
                e.pointerId
            );
        }
        catch(err){}
    }
);


/* =====================================================
   FLOATING HEARTS
===================================================== */

function createHeart(){

    const h =
        document.createElement("div");

    h.className =
        "heart";

    h.innerHTML =
        Math.random()>.5
        ? "❤️"
        : "💗";

    h.style.left =
        Math.random()*100+"%";

    h.style.bottom =
        "-30px";

    h.style.fontSize =
        12+Math.random()*22+"px";

    h.style.animationDuration =
        5+Math.random()*6+"s";

    space.appendChild(h);

    setTimeout(
        ()=>h.remove(),
        12000
    );
}

setInterval(
    createHeart,
    900
);


/* =====================================================
   ANIMATION LOOP
===================================================== */

let start =
    performance.now();

function animate(time){

    requestAnimationFrame(
        animate
    );

    const t =
        (time-start)/1000;


    bloom(time);


    /*
       Very subtle breathing.
    */

    const breathing =
        1+
        Math.sin(t*1.8)*.025;

    rose.scale.set(
        breathing,
        breathing,
        breathing
    );


    /*
       Automatic rotation
       unless user is dragging.
    */

    if(!dragging){

        rose.rotation.y =
            rotationY+t*.13;

    }
    else {

        rose.rotation.y =
            rotationY;
    }


    rose.rotation.x =
        rotationX;


    /*
       Red light pulses.
    */

    roseLight.intensity =
        12+
        Math.sin(t*3)*4;


    roseLight.position.x =
        Math.sin(t*1.5)*2;


    roseLight.position.z =
        2+
        Math.cos(t*1.2);


    glow.material.opacity =
        .11+
        Math.sin(t*2)*.035;


    renderer.render(
        scene,
        camera
    );
}

animate(
    performance.now()
);


/* =====================================================
   MESSAGE
===================================================== */

setTimeout(
    ()=>{
        document
            .getElementById("message")
            .classList.add("show");
    },
    9000
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth/
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
