<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background:
        radial-gradient(circle at 50% 30%, #263b86 0%, #111a4b 35%, #050817 100%);
    font-family: Georgia, serif;
    color: white;
}

/* ---------------- SCENE ---------------- */

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}

/* ---------------- STARS ---------------- */

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

.s1 { left: 10%; top: 15%; animation-delay: .2s; }
.s2 { left: 20%; top: 30%; animation-delay: .8s; }
.s3 { left: 35%; top: 12%; animation-delay: .5s; }
.s4 { left: 65%; top: 18%; animation-delay: 1s; }
.s5 { left: 78%; top: 10%; animation-delay: .3s; }
.s6 { left: 90%; top: 28%; animation-delay: 1.2s; }
.s7 { left: 55%; top: 35%; animation-delay: .6s; }
.s8 { left: 30%; top: 42%; animation-delay: .9s; }

@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* ---------------- MOON ---------------- */

.moon {
    position: absolute;
    top: 8%;
    right: 12%;

    width: 90px;
    height: 90px;

    border-radius: 50%;

    background: #fff8d6;

    box-shadow:
        0 0 25px #fff8d6,
        0 0 60px rgba(255,255,210,.5);
}

/* ---------------- GROUND ---------------- */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 18%;

    background:
        linear-gradient(to top, #020b08, #061c13);
}

/* ---------------- MAIN FLOWER ---------------- */

.flower {
    position: absolute;

    left: 50%;
    top: 48%;

    width: 220px;
    height: 330px;

    transform: translate(-50%, -50%);

    animation: sway 4s ease-in-out infinite;
}

@keyframes sway {

    0%,100% {
        transform: translate(-50%, -50%) rotate(-2deg);
    }

    50% {
        transform: translate(-50%, -50%) rotate(2deg);
    }
}

/* STEM */

.stem {
    position: absolute;

    left: 104px;
    top: 100px;

    width: 12px;
    height: 190px;

    border-radius: 20px;

    background: linear-gradient(
        to right,
        #176b37,
        #55d878,
        #176b37
    );

    transform-origin: top;

    animation: grow 2s ease forwards;
}

@keyframes grow {

    from {
        height: 0;
    }

    to {
        height: 190px;
    }
}

/* ---------------- PETALS ---------------- */

.petal {

    position: absolute;

    left: 70px;
    top: 35px;

    width: 80px;
    height: 110px;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffb6d0,
            #ff5c91 50%,
            #d71963
        );

    border-radius: 50%;

    transform-origin: 40px 75px;

    box-shadow:
        0 0 15px rgba(255,80,140,.5);

    opacity: 0;

    animation: bloom 1s forwards;
}

.p1 {
    transform: rotate(0deg) translateY(-55px);
    animation-delay: .5s;
}

.p2 {
    transform: rotate(72deg) translateY(-55px);
    animation-delay: .7s;
}

.p3 {
    transform: rotate(144deg) translateY(-55px);
    animation-delay: .9s;
}

.p4 {
    transform: rotate(216deg) translateY(-55px);
    animation-delay: 1.1s;
}

.p5 {
    transform: rotate(288deg) translateY(-55px);
    animation-delay: 1.3s;
}

@keyframes bloom {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
    }
}

/* CENTER */

.center {

    position: absolute;

    left: 75px;
    top: 55px;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #fff27a,
            #ffc928
        );

    box-shadow:
        0 0 20px #ffd83d;

    z-index: 10;

    animation: heartbeat 2s infinite;
}

@keyframes heartbeat {

    0%,100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.08);
    }
}

/* ---------------- LEAVES ---------------- */

.leaf {

    position: absolute;

    width: 70px;
    height: 32px;

    background:
        linear-gradient(
            135deg,
            #69e58b,
            #168d42
        );

    border-radius: 100% 0 100% 0;
}

.leaf.left {

    left: 40px;
    top: 205px;

    transform: rotate(-25deg);
}

.leaf.right {

    right: 40px;
    top: 235px;

    transform: rotate(155deg);
}

/* ---------------- ROSES ---------------- */

.rose {

    position: absolute;

    font-size: 55px;

    animation:
        roseAppear 2s ease forwards,
        floatRose 4s ease-in-out infinite;

    opacity: 0;

    filter:
        drop-shadow(0 0 10px rgba(255,50,100,.5));
}

.rose1 {
    left: 12%;
    bottom: 12%;
    animation-delay: 1s;
}

.rose2 {
    left: 25%;
    bottom: 8%;
    animation-delay: 1.7s;
}

.rose3 {
    right: 22%;
    bottom: 10%;
    animation-delay: 2.4s;
}

.rose4 {
    right: 8%;
    bottom: 14%;
    animation-delay: 3s;
}

@keyframes roseAppear {

    from {
        opacity: 0;
        transform: scale(0);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes floatRose {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* ---------------- FLOATING HEARTS ---------------- */

.heart {

    position: absolute;

    bottom: -30px;

    font-size: 25px;

    animation: heartFloat 6s linear infinite;

    opacity: 0;
}

.h1 {
    left: 15%;
    animation-delay: 1s;
}

.h2 {
    left: 40%;
    animation-delay: 3s;
}

.h3 {
    left: 70%;
    animation-delay: 2s;
}

.h4 {
    left: 85%;
    animation-delay: 4s;
}

@keyframes heartFloat {

    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        transform: translateY(-100vh) scale(1.2);
        opacity: 0;
    }
}

/* ---------------- SPARKLES ---------------- */

.sparkle {

    position: absolute;

    font-size: 20px;

    animation: sparkleFloat 4s infinite;
}

.sp1 {
    left: 15%;
    top: 45%;
}

.sp2 {
    right: 15%;
    top: 50%;
    animation-delay: 1s;
}

.sp3 {
    left: 75%;
    top: 40%;
    animation-delay: 2s;
}

@keyframes sparkleFloat {

    0%,100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* ---------------- MESSAGE ---------------- */

.message {

    position: absolute;

    bottom: 5%;

    width: 100%;

    text-align: center;

    padding: 0 20px;

    animation: messageAppear 3s ease forwards;

    opacity: 0;
}

.mainText {

    font-size: 30px;

    font-weight: bold;

    letter-spacing: 1px;

    text-shadow:
        0 0 10px rgba(255,120,170,.8),
        0 0 25px rgba(255,80,140,.5);
}

.smallText {

    margin-top: 12px;

    font-size: 18px;

    font-style: italic;

    opacity: .9;
}

@keyframes messageAppear {

    from {
        opacity: 0;
        transform: translateY(30px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------------- MOBILE ---------------- */

@media (max-width: 600px) {

    .moon {
        width: 65px;
        height: 65px;
        right: 8%;
    }

    .flower {
        transform: translate(-50%, -50%) scale(.85);
    }

    .mainText {
        font-size: 23px;
    }

    .smallText {
        font-size: 15px;
    }

    .rose {
        font-size: 40px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- STARS -->

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>

    <!-- MOON -->

    <div class="moon"></div>

    <!-- MAIN FLOWER -->

    <div class="flower">

        <div class="stem"></div>

        <div class="leaf left"></div>
        <div class="leaf right"></div>

        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>

        <div class="center"></div>

    </div>

    <!-- ROSES -->

    <div class="rose rose1">🌹</div>
    <div class="rose rose2">🌹</div>
    <div class="rose rose3">🌹</div>
    <div class="rose rose4">🌹</div>

    <!-- HEARTS -->

    <div class="heart h1">❤️</div>
    <div class="heart h2">💕</div>
    <div class="heart h3">❤️</div>
    <div class="heart h4">💗</div>

    <!-- SPARKLES -->

    <div class="sparkle sp1">✨</div>
    <div class="sparkle sp2">✨</div>
    <div class="sparkle sp3">⭐</div>

    <!-- GROUND -->

    <div class="ground"></div>

    <!-- MESSAGE -->

    <div class="message">

        <div class="mainText">
            For the most beautiful person in my world ❤️
        </div>

        <div class="smallText">
            A little flower for you… because you deserve
            all the beautiful things in this world. 🌹✨
        </div>

    </div>

</div>

</body>
</html>
