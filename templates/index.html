<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌹 A Rose Among The Stars 🌌</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010105;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    color: white;
}

/* =========================
   UNIVERSE
========================= */

#space {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 55%,
            #260008 0%,
            #080009 42%,
            #010105 100%
        );
}

.star {
    position: absolute;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px white;
    animation: twinkle linear infinite;
}

.star.red {
    background: #ff1744;
    box-shadow: 0 0 12px #ff1744;
}

.star.blue {
    background: #55caff;
    box-shadow: 0 0 12px #55caff;
}

.star.pink {
    background: #ff72bb;
    box-shadow: 0 0 12px #ff72bb;
}

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.6);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }
}

/* =========================
   MOON
========================= */

.moon {
    position: absolute;
    width: 100px;
    height: 100px;
    right: 8%;
    top: 10%;
    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #dddddd 45%,
            #888888 100%
        );

    box-shadow:
        0 0 20px white,
        0 0 55px rgba(255,255,255,.35);

    animation: moonFloat 8s ease-in-out infinite;
}

@keyframes moonFloat {
    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-18px);
    }
}

/* =========================
   PLANETS
========================= */

.planet {
    position: absolute;
    border-radius: 50%;
    animation: planetFloat ease-in-out infinite;
}

.planet1 {
    width: 80px;
    height: 80px;
    left: 8%;
    top: 20%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ff8cff,
            #7b21a8 45%,
            #23002f 100%
        );

    box-shadow:
        0 0 30px rgba(200,50,255,.7);

    animation-duration: 9s;
}

.planet2 {
    width: 60px;
    height: 60px;
    right: 17%;
    bottom: 18%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #ffcc80,
            #ff5722 50%,
            #5c1200 100%
        );

    box-shadow:
        0 0 30px rgba(255,100,30,.6);

    animation-duration: 11s;
}

.planet3 {
    width: 42px;
    height: 42px;
    left: 20%;
    bottom: 18%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #9eeaff,
            #1976d2 50%,
            #001c45 100%
        );

    box-shadow:
        0 0 25px rgba(50,150,255,.6);

    animation-duration: 7s;
}

@keyframes planetFloat {
    0%,100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-25px) rotate(15deg);
    }
}

.ring {
    position: absolute;
    width: 150%;
    height: 35%;
    left: -25%;
    top: 32%;

    border: 3px solid rgba(255,190,100,.7);
    border-radius: 50%;

    transform: rotate(-18deg);
}

/* =========================
   TEXT
========================= */

.title {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);

    z-index: 20;
    width: 95%;

    text-align: center;

    font-size: clamp(22px,4vw,42px);

    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ff0033,
        0 0 25px #ff0033,
        0 0 55px #ff0033;
}

.subtitle {
    position: fixed;

    top: 75px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    width: 90%;

    text-align: center;

    color: #ffc5d0;

    font-size: clamp(14px,2vw,18px);

    text-shadow:
        0 0 10px #ff1744;
}

/* =========================
   THREE JS
========================= */

#canvas-container {
    position: fixed;
    inset: 0;
    z-index: 5;

    cursor: grab;
}

#canvas-container:active {
    cursor: grabbing;
}

canvas {
    display: block;
}

/* =========================
   MESSAGE
========================= */

.message {
    position: fixed;

    left: 50%;
    bottom: 30px;

    transform: translateX(-50%);

    z-index: 30;

    width: 90%;
    max-width: 800px;

    text-align: center;

    opacity: 0;

    transition:
        opacity 4s ease,
        transform 4s ease;

    pointer-events: none;
}

.message.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(-10px);
}

.english {
    font-size: clamp(18px,3vw,28px);

    text-shadow:
        0 0 10px #ff0033,
        0 0 30px #ff0033;
}

.urdu {
    margin-top: 10px;

    direction: rtl;

    font-size: clamp(18px,3vw,27px);

    color: #ffb6c5;

    text-shadow:
        0 0 10px #ff1744,
        0 0 25px #ff1744;
}

.hint {
    position: fixed;

    bottom: 8px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 30;

    font-family: Arial,sans-serif;

    font-size: 11px;

    color: rgba(255,255,255,.45);

    letter-spacing: 1px;
}

/* =========================
   HEARTS
========================= */

.heart {
    position: fixed;
    z-index: 10;

    color: #ff1744;

    pointer-events: none;

    text-shadow:
        0 0 8px #ff1744,
        0 0 20px #ff1744;

    animation: heartFloat linear forwards;
}

@keyframes heartFloat {

    0% {
        transform:
            translateY(0)
            scale(.5);

        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(-100vh)
            scale(1.3)
            rotate(25deg);

        opacity: 0;
    }
}

@media(max-width:600px) {

    .moon {
        width: 65px;
        height: 65px;
        right: 5%;
        top: 13%;
    }

    .planet1 {
        width: 50px;
        height: 50px;
        left: 4%;
    }

    .planet2 {
        width: 40px;
        height: 40px;
        right: 8%;
    }

    .planet3 {
        width: 30px;
        height: 30px;
    }
}
</style>
</head>


<body>

<div id="space"></div>

<div class="moon"></div>

<div class="planet planet1">
    <div class="ring"></div>
</div>

<div class="planet planet2"></div>
<div class="planet planet3"></div>

<div class="title">
    🌹 A Rose Among The Stars 🌌
</div>

<div class="subtitle">
    Some flowers are beautiful... but some are made for someone special ❤️
</div>

<div id="canvas-container"></div>

<div class="message" id="message">

    <div class="english">
        If I could give you one thing in this universe...
        <br>
        I'd give you this rose. 🌹
    </div>

    <div class="urdu">
        تم پھول نہیں، وہ خوشبو ہو جو دل میں ہمیشہ رہتی ہے ❤️
    </div>

</div>

<div class="hint">
    ✨ Drag the rose • Touch & drag on phone ✨
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   STARS
===================================================== */

const space =
    document.getElementById("space");

for(let i=0;i<1000;i++){

    const star =
        document.createElement("div");

    star.className = "star";

    const size =
        .5 + Math.random()*2.2;

    star.style.width =
        size+"px";

    star.style.height =
        size+"px";

    star.style.left =
        Math.random()*100+"%";

    star.style.top =
        Math.random()*100+"%";

    star.style.animationDuration =
        2+Math.random()*5+"s";

    star.style.animationDelay =
        Math.random()*5+"s";

    const type =
        Math.random();

    if(type<.05)
        star.classList.add("red");

    else if(type<.10)
        star.classList.add("blue");

    else if(type<.15)
        star.classList.add("pink");

    space.appendChild(star);
}


/* =====================================================
   THREE.JS
===================================================== */

const container =
    document.getElementById(
        "canvas-container"
    );

const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(
        40,
        window.innerWidth/
        window.innerHeight,
        .1,
        1000
    );


camera.position.set(
    0,
    .15,
    12
);


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.setClearColor(
    0x010105,
    0
);


container.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHT
===================================================== */

scene.add(
    new THREE.AmbientLight(
        0xffcbd4,
        1.6
    )
);


const whiteLight =
    new THREE.PointLight(
        0xffffff,
        3,
        50
    );

whiteLight.position.set(
    4,
    5,
    6
);

scene.add(
    whiteLight
);


const roseLight =
    new THREE.PointLight(
        0xff0033,
        18,
        24
    );

roseLight.position.set(
    0,
    1,
    2
);

scene.add(
    roseLight
);


/* =====================================================
   ROSE GROUP
===================================================== */

const rose =
    new THREE.Group();

rose.position.y =
    -1.15;

scene.add(rose);


/* =====================================================
   MATERIALS
===================================================== */

const outerMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0xc90025,

        roughness:.35,

        metalness:.01,

        clearcoat:1,

        clearcoatRoughness:.08,

        emissive:0x420009,

        emissiveIntensity:.45,

        side:THREE.DoubleSide
    });


const middleMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0xf00032,

        roughness:.25,

        metalness:.01,

        clearcoat:1,

        clearcoatRoughness:.06,

        emissive:0x710014,

        emissiveIntensity:.65,

        side:THREE.DoubleSide
    });


const innerMaterial =
    new THREE.MeshPhysicalMaterial({

        color:0xff174f,

        roughness:.20,

        metalness:.01,

        clearcoat:1,

        clearcoatRoughness:.05,

        emissive:0x9a001f,

        emissiveIntensity:.8,

        side:THREE.DoubleSide
    });


/* =====================================================
   CURVED PETAL
===================================================== */

function createPetalGeometry(
    width,
    height
){

    const geometry =
        new THREE.SphereGeometry(
            1,
            32,
            24
        );


    /*
       Turn the sphere into
       a long rose petal.
    */

    const pos =
        geometry.attributes.position;


    for(
        let i=0;
        i<pos.count;
        i++
    ){

        let x =
            pos.getX(i);

        let y =
            pos.getY(i);

        let z =
            pos.getZ(i);


        /*
           Make it taller.
        */

        y =
            y*height;


        /*
           Narrow bottom.
        */

        const normalized =
            (y+height)/
            (height*2);


        const widthFactor =
            .25+
            Math.sin(
                normalized*Math.PI
            )*.75;


        x =
            x*width*widthFactor;


        /*
           Cup the petal.
        */

        z =
            z*.28
            -
            x*x*.20;


        pos.setXYZ(
            i,
            x,
            y,
            z
        );
    }


    geometry.computeVertexNormals();

    return geometry;
}


/* =====================================================
   PETAL DATA
===================================================== */

const petals=[];


/* =====================================================
   CREATE BLOOMING PETAL
===================================================== */

function addPetal(
    angle,
    radius,
    width,
    height,
    material,
    layer,
    delay
){

    const geometry =
        createPetalGeometry(
            width,
            height
        );


    const petal =
        new THREE.Mesh(
            geometry,
            material
        );


    petal.userData = {

        angle:angle,

        radius:radius,

        delay:delay,

        layer:layer,

        /*
           Start almost completely
           closed.
        */

        closedRotation:
            -.95,

        openRotation:
            -.18
    };


    /*
       Tiny closed bud position.
    */

    petal.position.set(
        0,
        .9,
        0
    );


    petal.rotation.y =
        angle;

    petal.rotation.x =
        petal.userData.closedRotation;


    petal.scale.set(
        .01,
        .01,
        .01
    );


    rose.add(petal);

    petals.push(petal);
}


/* =====================================================
   INNER PETALS
   OPEN FIRST
===================================================== */

for(let i=0;i<10;i++){

    const angle =
        i/10*Math.PI*2;

    addPetal(
        angle,
        .30,
        .48,
        .95,
        innerMaterial,
        4,
        1+i*.12
    );
}


/* =====================================================
   SECOND INNER LAYER
===================================================== */

for(let i=0;i<13;i++){

    const angle =
        i/13*Math.PI*2
        +
        .15;

    addPetal(
        angle,
        .48,
        .57,
        1.15,
        innerMaterial,
        3,
        3+i*.12
    );
}


/* =====================================================
   MIDDLE LAYER
===================================================== */

for(let i=0;i<16;i++){

    const angle =
        i/16*Math.PI*2
        +
        .22;

    addPetal(
        angle,
        .68,
        .66,
        1.38,
        middleMaterial,
        2,
        5+i*.12
    );
}


/* =====================================================
   OUTER LAYER
===================================================== */

for(let i=0;i<20;i++){

    const angle =
        i/20*Math.PI*2
        +
        .30;

    addPetal(
        angle,
        .86,
        .76,
        1.60,
        outerMaterial,
        1,
        7+i*.13
    );
}


/* =====================================================
   OUTERMOST CUP
===================================================== */

for(let i=0;i<16;i++){

    const angle =
        i/16*Math.PI*2
        +
        .40;

    addPetal(
        angle,
        .98,
        .80,
        1.72,
        outerMaterial,
        0,
        9+i*.12
    );
}


/* =====================================================
   CENTER
===================================================== */

const center =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .27,
            32,
            24
        ),

        new THREE.MeshPhysicalMaterial({

            color:0xff0033,

            emissive:0xff001f,

            emissiveIntensity:1.5,

            roughness:.18,

            clearcoat:1
        })
    );


center.position.y =
    1.05;


center.scale.setScalar(
    .01
);


rose.add(center);


/* =====================================================
   CENTER CURLS
===================================================== */

const curls=[];


for(let i=0;i<8;i++){

    const geometry =
        new THREE.TorusGeometry(
            .10+i*.025,
            .023,
            12,
            32,
            Math.PI*1.55
        );


    const curl =
        new THREE.Mesh(
            geometry,
            innerMaterial
        );


    curl.position.y =
        1.05+i*.025;


    curl.rotation.x =
        Math.PI/2;


    curl.rotation.z =
        i*.8;


    curl.scale.setScalar(
        .01
    );


    rose.add(curl);

    curls.push(curl);
}


/* =====================================================
   STEM
===================================================== */

const stem =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .08,
            .13,
            4.8,
            24
        ),

        new THREE.MeshPhysicalMaterial({

            color:0x08752a,

            roughness:.6,

            emissive:0x002d0d,

            emissiveIntensity:.3
        })
    );


stem.position.y =
    -1.8;


rose.add(stem);


/* =====================================================
   LEAVES
===================================================== */

function makeLeaf(
    x,
    y,
    rotation,
    size
){

    const geometry =
        new THREE.SphereGeometry(
            1,
            28,
            18
        );


    geometry.scale(
        .75*size,
        .14*size,
        .34*size
    );


    const leaf =
        new THREE.Mesh(

            geometry,

            new THREE.MeshPhysicalMaterial({

                color:0x078f2e,

                roughness:.55,

                emissive:0x002d0c,

                emissiveIntensity:.25,

                side:THREE.DoubleSide
            })
        );


    leaf.position.set(
        x,
        y,
        0
    );


    leaf.rotation.z =
        rotation;


    rose.add(leaf);
}


makeLeaf(
    -.50,
    -1.0,
    -.45,
    1
);

makeLeaf(
    .50,
    -1.45,
    .45,
    .95
);

makeLeaf(
    -.40,
    -2.05,
    -.5,
    .85
);


/* =====================================================
   GROUND GLOW
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.CircleGeometry(
            2.7,
            64
        ),

        new THREE.MeshBasicMaterial({

            color:0xff0033,

            transparent:true,

            opacity:.13,

            side:THREE.DoubleSide
        })
    );


ground.rotation.x =
    -Math.PI/2;


ground.position.y =
    -4.15;


rose.add(ground);


/* =====================================================
   REAL BLOOM ANIMATION
===================================================== */

const bloomStart =
    performance.now();


function animateBloom(time){

    const seconds =
        (time-bloomStart)/1000;


    petals.forEach(
        petal => {

            const d =
                petal.userData;


            /*
               Each layer waits
               for the previous layer.
            */

            let p =
                (seconds-d.delay)/3.0;


            p =
                Math.max(
                    0,
                    Math.min(
                        1,
                        p
                    )
                );


            /*
               Very slow smooth movement.
            */

            const ease =
                p<.5

                ? 4*p*p*p

                : 1-
                  Math.pow(
                      -2*p+2,
                      3
                  )/2;


            /*
               Petal starts tiny.
            */

            const scale =
                .01+
                ease*.99;


            petal.scale.setScalar(
                scale
            );


            /*
               START:
               tight at center.

               END:
               gradually moves outward.
            */

            const currentRadius =
                d.radius*
                ease;


            petal.position.x =
                Math.cos(d.angle)
                *currentRadius;


            petal.position.z =
                Math.sin(d.angle)
                *currentRadius;


            /*
               The petal rises first,
               then opens outward.
            */

            petal.position.y =
                .9
                +
                Math.sin(
                    ease*Math.PI
                )*.22;


            /*
               THIS is the important
               bloom movement.

               Closed:
               petals point upward.

               Open:
               petals bend outward.
            */

            petal.rotation.x =
                d.closedRotation
                +
                (
                    d.openRotation
                    -
                    d.closedRotation
                )
                *ease;


            /*
               Outer petals open
               slightly farther.
            */

            if(d.layer <= 1){

                petal.rotation.x =
                    -.95+
                    .68*ease;
            }
        }
    );


    /*
       Center appears slowly.
    */

    const centerP =
        Math.max(
            0,
            Math.min(
                1,
                (seconds-3)/3
            )
        );


    center.scale.setScalar(
        centerP
    );


    /*
       Inner curls.
    */

    curls.forEach(
        (curl,i)=>{

            const p =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (seconds-4-i*.12)/3
                    )
                );


            const e =
                1-
                Math.pow(
                    1-p,
                    3
                );


            curl.scale.setScalar(
                e
            );
        }
    );
}


/* =====================================================
   DRAG ROTATION
===================================================== */

let dragging=false;

let lastX=0;
let lastY=0;

let rotationY=0;
let rotationX=0;


renderer.domElement.addEventListener(
    "pointerdown",
    e=>{

        dragging=true;

        lastX=e.clientX;
        lastY=e.clientY;

        renderer.domElement.setPointerCapture(
            e.pointerId
        );
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    e=>{

        if(!dragging)
            return;


        const dx =
            e.clientX-lastX;


        const dy =
            e.clientY-lastY;


        rotationY +=
            dx*.012;


        rotationX +=
            dy*.008;


        rotationX =
            Math.max(
                -1,
                Math.min(
                    1,
                    rotationX
                )
            );


        lastX=e.clientX;
        lastY=e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    e=>{

        dragging=false;

        try{

            renderer.domElement.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}
    }
);


/* =====================================================
   FLOATING HEARTS
===================================================== */

function createHeart(){

    const heart =
        document.createElement("div");

    heart.className="heart";

    heart.innerHTML =
        Math.random()>.5
        ? "❤️"
        : "💗";


    heart.style.left =
        Math.random()*100+"%";


    heart.style.bottom =
        "-30px";


    heart.style.fontSize =
        12+Math.random()*22+"px";


    heart.style.animationDuration =
        5+Math.random()*6+"s";


    space.appendChild(
        heart
    );


    setTimeout(
        ()=>heart.remove(),
        12000
    );
}


setInterval(
    createHeart,
    1200
);


/* =====================================================
   MAIN ANIMATION
===================================================== */

let start =
    performance.now();


function animate(time){

    requestAnimationFrame(
        animate
    );


    const t =
        (time-start)/1000;


    animateBloom(time);


    /*
       Very subtle natural movement.
    */

    const breathing =
        1+
        Math.sin(t*1.4)*.015;


    rose.scale.set(
        breathing,
        breathing,
        breathing
    );


    /*
       Slow rotation after bloom.
    */

    if(!dragging){

        rose.rotation.y =
            rotationY+
            t*.055;

    }else{

        rose.rotation.y =
            rotationY;
    }


    rose.rotation.x =
        rotationX;


    /*
       Red glow breathing.
    */

    roseLight.intensity =
        14+
        Math.sin(t*1.5)*3;


    roseLight.position.x =
        Math.sin(t*.8)*2;


    roseLight.position.z =
        2+
        Math.cos(t*.7);


    ground.material.opacity =
        .10+
        Math.sin(t*1.5)*.025;


    renderer.render(
        scene,
        camera
    );
}


animate(
    performance.now()
);


/* =====================================================
   MESSAGE AFTER BLOOM
===================================================== */

setTimeout(
    ()=>{

        document
            .getElementById("message")
            .classList.add("show");

    },
    21000
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth/
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
